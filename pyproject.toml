[project]
name = "livelonger"
version = "0.1.0"
description = "Archive LiveJournal journals (entries, comments, connections, style) into a browsable local mirror, politely."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
livelonger = "livelonger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["livelonger"]

[tool.setuptools.package-data]
livelonger = ["assets/*"]
